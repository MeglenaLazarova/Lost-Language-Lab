<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="/common.css">
    <link rel="stylesheet" type="text/css" href="/form.css">
    <title>Register</title>
    <link rel="stylesheet" href="/css/register.css">
</head>

<body>

<main>
    <section class="section full-height">

        <div class="container">
            <a href="/" class="logo-big">
                <img src="/images/biblioteka.png" alt="Logo Image">
            </a>
        </div>

        <form class="form" th:action="@{/register}" th:method="post" th:object="${registerDTO}">

            <h3>Register Here</h3>

            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Username" th:field="*{username}">
            <p class="alert-warning" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Email" th:field="*{email}">
            <p class="alert-warning" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

            <label for="firstName">First Name</label>
            <input type="text" id="firstName" placeholder="First Name" th:field="*{firstName}">
            <p class="alert-warning" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></p>

            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" placeholder="Last Name" th:field="*{lastName}">
            <p class="alert-warning" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></p>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Password" th:field="*{password}">
            <p class="alert-warning" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm Password" th:field="*{confirmPassword}">
            <p class="alert-warning" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>

            <button type="submit">Register</button>

            <p class="form-already">Already have an account? <a href="/login">Login</a>!</p>
        </form>

    </section>
</main>

<div class="footer"><p>© 2025 Lost Language Lab. All rights reserved.</p></div>

</body>
</html>
